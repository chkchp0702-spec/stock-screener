name: backtest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 6"     # 토요일 10:00 KST

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas numpy
      - run: python backtest.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - name: commit results
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data/backtest
          git diff --staged --quiet || git commit -m "backtest $(TZ=Asia/Seoul date +%m/%d)"
          git pull --rebase || true
          git push || true

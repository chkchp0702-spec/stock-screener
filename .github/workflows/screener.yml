name: screener

on:
  workflow_dispatch:
  schedule:
    - cron: "0,10,20,30,40,50 0-6 * * 1-5"

permissions:
  contents: write
  actions: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests pandas

      - run: python screener.py
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}

      - name: commit results
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git pull --rebase || true
          git add data/
          git diff --staged --quiet || git commit -m "scan $(date +%H:%M)"
          git push

      - name: next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          H=$(TZ=Asia/Seoul date +%H)
          D=$(TZ=Asia/Seoul date +%u)
          if [ "$D" -le 5 ] && [ "$H" -ge 9 ] && [ "$H" -lt 15 ]; then
            sleep 480
            gh workflow run screener.yml --repo ${{ github.repository }}
          else
            echo "장 시간 외"
          fi

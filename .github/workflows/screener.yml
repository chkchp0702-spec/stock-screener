name: screener

on:
  workflow_dispatch:
  schedule:
    - cron: "55 23 * * 0-4"   # 08:55 KST 오전 세션 (cron-job.org 누락 대비)
    - cron: "5 3 * * 1-5"     # 12:05 KST 오후 세션 (오전 세션 자기 호출 누락 대비)

permissions:
  contents: write
  actions: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
      - name: 하루 압축본 받기 (days 브랜치 → data/days, 학습·오후 세션용)
        run: python gitsync.py days-pull
        continue-on-error: true
      - run: python screener.py
        continue-on-error: true
        env:
          LOOP: "1"
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - name: commit results
        if: always()
        run: |
          # data/days 는 main 에 안 올림 (아래 days 브랜치로) — 작은 파일만
          for p in data/tracking.csv data/sent.json data/summary_done.txt data/next_done.txt data/learn data/learned.json data/theme_log.csv data/paused.txt data/tg_offset.txt data/session_end.txt; do
            if [ -e "$p" ]; then git add -A "$p"; fi
          done
          git add -u data/snaps 2>/dev/null || true
          git diff --staged --quiet || git commit -m "scan $(TZ=Asia/Seoul date +%H:%M)"
          python gitsync.py push-main      # pull --rebase + 5번 재시도, 실패하면 단타 알림 + 빨간불
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - name: 하루 압축본 올리기 (days 브랜치, 커밋 하나 덮어쓰기)
        if: always()
        run: python gitsync.py days-push
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - name: afternoon session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          H=$(TZ=Asia/Seoul date +%H%M)
          D=$(TZ=Asia/Seoul date +%u)
          if [ "$D" -le 5 ] && [ "$H" -ge 1150 ] && [ "$H" -lt 1230 ]; then
            gh workflow run screener.yml --repo ${{ github.repository }}
          else
            echo "오후 세션 호출 없음"
          fi
